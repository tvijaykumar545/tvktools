name: Backend tools regression

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/functions/ai-tool/**"
      - "src/test/backend-tools.regression.test.ts"
      - "vitest.regression.config.ts"
      - ".github/workflows/backend-regression.yml"
  schedule:
    # Daily smoke at 06:00 UTC to catch silent drift in the deployed function.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  regression:
    name: ai-tool: no 402, no empty output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Check required secrets
        id: check_secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$TEST_USER_EMAIL" ] || [ -z "$TEST_USER_PASSWORD" ]; then
            echo "::warning::Skipping regression suite — required secrets are not configured (VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, TEST_USER_EMAIL, TEST_USER_PASSWORD)."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secrets.outputs.has_secrets == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.check_secrets.outputs.has_secrets == 'true'
        with:
          bun-version: latest
      - name: Install dependencies
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: bun install --frozen-lockfile
      - name: Run backend regression suite
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: bun run test:backend-regression
