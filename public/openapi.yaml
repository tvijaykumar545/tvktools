openapi: 3.1.0
info:
  title: TVK Tools API
  version: "1.0.0"
  description: Public REST API for TVK Tools. Authenticate with a bearer API key created from the API Access page.
servers:
  - url: https://xavthzgizngnmautbhmx.supabase.co/functions/v1/api-v1
    description: Production
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tvk_live_*
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object }
        meta: { type: object }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        meta: { type: object }
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses: { "200": { description: OK } }
  /me:
    get:
      summary: Current account
      responses: { "200": { description: OK } }
  /points/balance:
    get:
      summary: Points balance
      responses: { "200": { description: OK } }
  /tools:
    get:
      summary: List tools
      parameters:
        - in: query
          name: category
          schema: { type: string }
      responses: { "200": { description: OK } }
  /tools/{toolId}:
    get:
      summary: Tool metadata
      parameters:
        - in: path
          name: toolId
          required: true
          schema: { type: string }
      responses: { "200": { description: OK } }
  /tools/{toolId}/run:
    post:
      summary: Run a tool by id
      parameters:
        - in: path
          name: toolId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string, maxLength: 4000 }
      responses:
        "200": { description: OK }
        "402": { description: Insufficient points }
  /ai/run:
    post:
      summary: Run an AI tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toolId, input]
              properties:
                toolId: { type: string }
                input: { type: string, maxLength: 4000 }
      responses:
        "200": { description: OK }
        "402": { description: Insufficient points }
  /usage:
    get:
      summary: Recent API request log
      parameters:
        - in: query
          name: limit
          schema: { type: integer, maximum: 200, default: 50 }
      responses: { "200": { description: OK } }
